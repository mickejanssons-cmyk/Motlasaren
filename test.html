<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mikrofontest</title>
<style>
body{font:16px -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
h1{font-size:22px;margin:0 0 12px}
button{display:block;width:100%;margin:8px 0;padding:14px;border-radius:12px;border:0;background:#F2B648;color:#1a1206;font:600 16px -apple-system,system-ui,sans-serif}
button.g{background:#2a282e;color:#eee}
#log{white-space:pre-wrap;background:#1c1b20;border-radius:12px;padding:12px;font:13px ui-monospace,monospace;min-height:160px;margin-top:12px}
p{color:#aaa;font-size:14px}
</style>
</head>
<body>
<h1>Mikrofontest</h1>
<p>Tryck på A, säg några ord, vänta fem sekunder. Gör sedan samma sak med B, C och D. Ta en skärmbild av loggen och skicka den.</p>
<button id="a">A. Svenska, lyssna hela tiden</button>
<button id="b">B. Svenska, en mening</button>
<button id="c">C. Telefonens eget språk, en mening</button>
<button id="d">D. Bara mikrofonen (ingen igenkänning)</button>
<button id="x" class="g">Stoppa</button>
<div id="log"></div>
<script>
var L=document.getElementById('log');function log(t){L.textContent+=new Date().toLocaleTimeString()+'  '+t+'\n';}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,cur=null;
log('Webbläsare: '+navigator.userAgent.replace(/.*(iPhone OS [\d_]+).*(Version\/[\d.]+).*/,'$1 · $2'));
log('Röstigenkänning finns: '+(SR?'ja':'nej')+' · Webbapp-läge: '+(navigator.standalone?'ja':'nej')+' · Språk: '+navigator.language);
function run(name,lang,cont){if(!SR){log('Ingen röstigenkänning.');return;}try{if(cur)cur.abort();}catch(e){}
  var r=new SR();if(lang)r.lang=lang;r.continuous=cont;r.interimResults=true;cur=r;
  ['start','audiostart','soundstart','speechstart','speechend','audioend','end','nomatch'].forEach(function(ev){r.addEventListener(ev,function(){log(name+': '+ev);});});
  r.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;log(name+': hörde "'+t+'"');};
  r.onerror=function(e){log(name+': FEL '+e.error+(e.message?' – '+e.message:''));};
  try{r.start();log(name+': start() anropad');}catch(e){log(name+': start() kastade '+e);}}
document.getElementById('a').onclick=function(){run('A','sv-SE',true);};
document.getElementById('b').onclick=function(){run('B','sv-SE',false);};
document.getElementById('c').onclick=function(){run('C','',false);};
document.getElementById('d').onclick=function(){if(!navigator.mediaDevices){log('D: getUserMedia saknas');return;}navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){log('D: mikrofon OK');setTimeout(function(){s.getTracks().forEach(function(t){t.stop();});log('D: mikrofon stängd');},2000);}).catch(function(e){log('D: FEL '+e.name+' – '+e.message);});};
document.getElementById('x').onclick=function(){try{cur&&cur.stop();}catch(e){}log('stopp');};
</script>
</body>
</html>
