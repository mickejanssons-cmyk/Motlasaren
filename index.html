<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0E11">
<link rel="apple-touch-icon" href="icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="Motläsaren">
<link rel="icon" type="image/png" href="icon-512.png?v=3">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
window.addEventListener('error',function(e){try{var d=document.getElementById('diag')||document.createElement('div');d.id='diag';d.style.cssText='position:fixed;left:8px;right:8px;top:40px;z-index:99;background:#B42318;color:#fff;padding:10px;border-radius:10px;font:14px -apple-system,sans-serif';d.textContent='Fel i appen: '+(e.message||e)+' (rad '+(e.lineno||'?')+')';(document.body||document.documentElement).appendChild(d);}catch(x){}});
</script>
<title>Motläsaren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: en black box-scen. Manuset som en kolumn i strålkastarljus; scenrubriker som filmklappor; fast "Repetera"-knapp nertill; repetitionen som en egen scen med transportknappar */
:root{
  --stage:#0F0E11; --wing:#18171B; --wing-2:#222026; --ink:#EEE8DE; --muted:#9C968E; --rule:#2C2930;
  --spot:#F2B648; --spot-ink:#1A1206; --glow:rgba(242,182,72,.16); --curtain:#D2504A;
  --hl:#F2B648; --hl-ink:#17110A; --scrim:rgba(0,0,0,.62); --danger:#FF8A7A;
  --c1:#FF9B5E; --c2:#8FB0FF; --c3:#6EE19A; --c4:#CDA2FF; --c5:#F7CF5C; --c6:#4ED6EE; --c7:#FF85BE; --c8:#A9AFB9;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-ui:"Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-script:"Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --stage:#ECEEF1; --wing:#FFFFFF; --wing-2:#F4F5F7; --ink:#17161B; --muted:#5D5964; --rule:#D8D9DF;
  --spot:#E5A33A; --spot-ink:#1A1206; --glow:rgba(229,163,58,.22); --curtain:#A8332D;
  --hl:#FFD566; --hl-ink:#17110A; --scrim:rgba(20,20,26,.45); --danger:#B42318;
  --c1:#C2410C; --c2:#2549C2; --c3:#15803D; --c4:#8B33E0; --c5:#9A5B05; --c6:#0E7490; --c7:#BE185D; --c8:#5B6370;
  color-scheme:light}}
:root[data-theme="light"]{
  --stage:#ECEEF1; --wing:#FFFFFF; --wing-2:#F4F5F7; --ink:#17161B; --muted:#5D5964; --rule:#D8D9DF;
  --spot:#E5A33A; --spot-ink:#1A1206; --glow:rgba(229,163,58,.22); --curtain:#A8332D;
  --hl:#FFD566; --hl-ink:#17110A; --scrim:rgba(20,20,26,.45); --danger:#B42318;
  --c1:#C2410C; --c2:#2549C2; --c3:#15803D; --c4:#8B33E0; --c5:#9A5B05; --c6:#0E7490; --c7:#BE185D; --c8:#5B6370;
  color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--stage)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--stage)}
html.r-open body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}

/* huvud */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--stage);padding-block:14px 12px;border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:.9;letter-spacing:.04em;text-transform:uppercase}
.logo i{font-style:normal;color:var(--spot)}
.sub{display:block;color:var(--muted);font-size:13px;margin-top:6px;min-width:0;overflow-wrap:anywhere}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--wing);border:1px solid var(--rule);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
nav button:active{background:var(--wing-2)}
.legend{margin:10px 0 0;font-size:13px;color:var(--muted)}
.legend mark{background:var(--hl);color:var(--hl-ink);padding:0 .3em;border-radius:2px}

.banner{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--rule);border-radius:14px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--wing)}
.banner button{background:var(--spot);color:var(--spot-ink);border:0;border-radius:999px;padding:7px 14px;font-weight:700}

/* manus */
#script{padding-block:6px 24px}
.blk{padding:10px 0;scroll-margin-top:140px}
.blk.head{padding-top:26px}
.blk.head h2{margin:0;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance;line-height:1.05}
.blk.head.scene{border-top:1px solid var(--rule);margin-top:14px;padding-top:14px}
.blk.head.scene h2{font-size:20px}
.blk.head.scene h2::before{content:"Scen";flex:none;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--spot);border:1px solid var(--spot);border-radius:4px;padding:2px 6px}
.blk.head.act{padding-top:36px}
.blk.head.act h2{font-size:38px;color:var(--ink)}
.blk.dir p{margin:0;font-family:var(--f-script);font-style:italic;color:var(--muted);padding-left:2.2em;font-size:15px}
.blk.line{cursor:pointer;border-radius:12px;padding:10px 10px;margin:0 -10px;transition:background .15s}
.blk.line:active{background:var(--wing)}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.nm{font-family:var(--f-script);font-weight:700;letter-spacing:.06em;color:var(--cc,var(--ink))}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.blk.me .tag{border-color:transparent;background:var(--hl);color:var(--hl-ink)}
.ovr{font-size:12px;color:var(--muted)}
.more{margin-left:auto;background:transparent;border:0;width:40px;height:32px;border-radius:8px;font-size:20px;line-height:1;color:var(--muted)}
.txt{margin:5px 0 0;font-family:var(--f-script);font-size:17px;line-height:1.55;overflow-wrap:anywhere}
mark{background:linear-gradient(transparent 8%,var(--hl) 8%,var(--hl) 92%,transparent 92%);color:var(--hl-ink);padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pd{color:var(--muted)}
mark .pd{color:inherit;opacity:.7}
.pz{display:inline-block;font-family:var(--f-ui);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin:0 2px;vertical-align:2px;color:var(--muted)}
mark .pz{color:var(--hl-ink)}

/* knapprad nertill */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--stage) 30%);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:8px}
.primary{background:var(--spot);color:var(--spot-ink);border:0;border-radius:14px;min-height:54px;padding:0 18px;font-weight:700;font-size:17px;letter-spacing:.01em;box-shadow:0 8px 28px var(--glow)}
.primary:active{transform:translateY(1px)}
.ghost{background:var(--wing);border:1px solid var(--rule);border-radius:14px;min-height:48px;padding:0 14px;font-weight:600}
.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:14px;min-height:48px;padding:0 14px;font-weight:600}
.wide{width:100%}
.bar .primary{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}

/* ark */
#sheet{position:fixed;inset:0;z-index:40}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--wing);border-radius:20px 20px 0 0;border-top:1px solid var(--rule);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:14px}
.sheet-in h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{background:var(--wing-2);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;font-family:var(--f-ui);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
.note{margin:0;font-size:14px;color:var(--muted)}
.warn{margin:0;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--wing-2);border:1px solid var(--rule)}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
select,input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;width:100%}
textarea{font-family:var(--f-script);line-height:1.45;resize:vertical}
input[type=range]{width:100%;accent-color:var(--spot)}
input[type=checkbox],input[type=radio]{accent-color:var(--spot);width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.file{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:14px;background:var(--spot);color:var(--spot-ink);font-weight:700;font-size:17px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 28px var(--glow)}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
details[open] > *:not(summary){margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--stage)}
.seg button{background:transparent;border:0;padding:10px 4px;font-size:14px;font-weight:600}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--spot);color:var(--spot-ink)}
.role{border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:10px}
.role-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.role-h b{font-family:var(--f-script);letter-spacing:.06em}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.role-b{display:grid;gap:10px;padding-left:30px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-act{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.sc-row{display:flex;gap:8px;align-items:stretch}
.sc-go{flex:1;min-width:0;text-align:left;background:var(--stage);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.sc-go b{font-weight:700;overflow-wrap:anywhere}
.sc-row .primary{min-height:auto;font-size:15px;box-shadow:none}

/* repetition */
#rehearse{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 90% 45% at 50% -10%,var(--glow),transparent 75%),var(--stage);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.x.mic{display:inline-flex;align-items:center;gap:7px}
.x.mic::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.x.mic.on::before{background:#3BD16F;box-shadow:0 0 0 3px rgba(59,209,111,.2)}
.x.mic.off{color:var(--muted)}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:680px;width:100%;margin:0 auto}
#rCount{font-family:var(--f-script);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;letter-spacing:.06em;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-dict{max-width:680px;width:100%;margin:8px auto 0;display:grid;gap:4px}
.r-dict textarea{font-family:var(--f-ui);font-size:16px;padding:8px 10px;max-height:70px}
.r-stage{cursor:pointer;flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:680px;width:100%;margin:0 auto;padding-block:12px}
.r-prev{font-family:var(--f-script);font-size:15px;color:var(--muted);line-height:1.45;min-height:1em;opacity:.85}
.r-nm{font-family:var(--f-script);font-weight:700;letter-spacing:.08em;font-size:14px;text-transform:uppercase}
.r-card{background:var(--wing);border:1px solid var(--rule);border-radius:20px;padding:20px;display:grid;gap:14px}
.r-card.mine{border-color:var(--spot);box-shadow:0 0 0 1px var(--spot),0 18px 50px var(--glow)}
.r-card.dir .r-txt{font-style:italic;color:var(--muted)}
.r-txt{margin:0;font-family:var(--f-script);font-size:23px;line-height:1.45;overflow-wrap:anywhere}
.r-txt.hint{letter-spacing:.06em;color:var(--muted)}
.r-end{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.05em;text-transform:uppercase}

.r-heard{font-family:var(--f-script);font-size:14px;color:var(--muted);min-height:1em;overflow-wrap:anywhere}
.r-asr{font-size:12px;color:var(--muted)}
#rStatus{min-height:44px;font-size:15px;color:var(--muted);display:grid;gap:8px}
.lvl{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rule);vertical-align:1px;margin-left:4px}
.lvl.on{background:#3BD16F;box-shadow:0 0 0 4px rgba(59,209,111,.25)}
.meter{height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--spot);transition:width .2s}
.r-ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;width:100%;margin:0 auto;align-items:end}
.r-ctrl button{background:transparent;border:0;display:grid;justify-items:center;gap:6px;padding:4px 0;font-size:12px;font-weight:600;color:var(--muted)}
.r-ctrl button .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--wing);border:1px solid var(--rule);color:var(--ink)}
.r-ctrl button.play .ic{width:66px;height:66px;background:var(--spot);border-color:var(--spot);color:var(--spot-ink);box-shadow:0 8px 28px var(--glow)}
.r-ctrl svg{width:22px;height:22px}
.r-ctrl button:active .ic{transform:scale(.96)}

#toast{position:fixed;max-width:520px;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:60;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--stage);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3)}
@media (prefers-reduced-motion: reduce){.meter i,.blk.line{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div style="min-width:0"><span class="logo">Mot<i>läsaren</i></span><span class="sub" id="title"></span></div>
      <nav>
        <button type="button" data-open="import">Manus</button>
        <button type="button" data-open="scenes">Scener</button>
        <button type="button" data-open="roles">Roller</button>
        <button type="button" data-open="settings">Inställningar</button>
      </nav>
    </div>
    <p class="legend"><mark>Markerat</mark> = du läser själv. Tryck på en replik för att växla mellan dig och AI.</p>
  </header>
  <div id="exBanner" class="banner" hidden>Det här är ett exempelmanus. <button type="button" data-open="import">Lägg in ditt eget</button></div>
  <div id="ttsBanner" class="banner" hidden>Den här vyn har ingen talsyntes, så AI:n kan inte läsa högt här.</div>
  <main id="script"></main>
</div>

<div class="bar"><div class="wrap">
  <button type="button" id="playFrom" class="primary">Repetera</button>
  <button type="button" id="playStart" class="ghost">Från början</button>
</div></div>

<div id="rehearse" hidden>
  <div class="r-top"><button type="button" class="x" id="rClose">Avsluta</button><button type="button" class="x mic" id="rMic">Mikrofon</button><span id="rCount"></span></div>
  <div class="r-stage">
    <div class="r-prev" id="rPrev"></div>
    <div class="r-card" id="rCard"></div>
    <div id="rStatus" aria-live="polite"></div>
    <div id="rTts" class="r-asr"></div>
  </div>
  <div class="r-ctrl">
    <button type="button" id="rBack"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.8v12.4a.8.8 0 0 1-1.2.7L9.4 12.7a.8.8 0 0 1 0-1.4l8.4-6.2a.8.8 0 0 1 1.2.7z"/></svg></span>Backa</button>
    <button type="button" id="rRepeat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></span>Igen</button>
    <button type="button" id="rPlay" class="play"></button>
    <button type="button" id="rNext"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><path d="M5 5.8v12.4a.8.8 0 0 0 1.2.7l8.4-6.2a.8.8 0 0 0 0-1.4L6.2 5.1A.8.8 0 0 0 5 5.8z"/></svg></span>Hoppa</button>
  </div>
</div>

<div id="sheet" hidden><div class="scrim"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
const STORE='motlasaren.v1';
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

const EXAMPLE=`SCEN 1. Ett kök, tidig morgon.

(VERA står vid fönstret med en kaffekopp. JONAS kommer in, håret på ända.)

JONAS: Är det kaffe kvar?
VERA: Det är alltid kaffe kvar. Det är det enda i det här huset som det alltid finns kvar av.
JONAS: (trött) Du har varit uppe länge.
VERA: Sedan fyra. (paus) Jag kunde inte sova.
JONAS: Var det telefonen igen?
VERA: Han ringde inte. Det var det som var problemet.
(JONAS häller upp kaffe och ställer koppen framför henne.)
JONAS: Han ringer. Han gör alltid det, till slut.
VERA: (argt) Till slut! Jag är så trött på till slut!
JONAS: Vera.
VERA: (lågt) Förlåt. / Det är inte ditt fel.
JONAS: Nej. Men jag är här. Det är väl något.
VERA: (ler) Det är mycket, faktiskt.`;

const TONES={
  auto:{label:'Automatisk (efter scenanvisning)'},
  neutral:{label:'Neutral',rate:1,pitch:1,vol:1},
  varm:{label:'Varm',rate:.93,pitch:.96,vol:.9},
  glad:{label:'Glad',rate:1.07,pitch:1.12,vol:1},

  for(let k=0;k<out.length;k++){const n=bl.slice(out[k].start,out[k].end).findIndex((b,j)=>j>0&&b.type==='head');if(n>0)out[k].end=out[k].start+n;}

$('#rBack').onclick=()=>{if(R.autoAt&&Date.now()-R.autoAt.t<4000){const b=findB(R.autoAt.id);if(b){const nW=expected(b.text).length;const base=Math.max(b.mySpeak||0,Math.max(.5,(nW*.2+Math.max(0,nW-6)*.25+Math.max(0,nW-14)*.15)*(S.settings.pace||1)));b.mySpeak=Math.min(90,base*1.35);save();toast('Okej, appen väntar längre på den repliken från och med nu.');}}R.autoAt=null;R.idx=Math.max(0,R.idx-1);R.paused=false;step();};
$('#rRepeat').onclick=()=>{R.paused=false;step();};
$('#rPlay').onclick=togglePause;
$('#rNext').onclick=()=>{if(R.idx<R.queue.length){R.paused=false;advance();}};
function tapDone(){const b=R.queue[R.idx];if(!b||R.paused||b.type!=='line'||readerOf(b)!=='me')return;
  const el=(Date.now()-R.mineStart)/1000;if(S.settings.fallback==='timer'&&micState!=='ok'&&el>.6)b.myTime=clamp(el+.3,.8,90);R.autoAt=null;advance();}
document.querySelector('.r-stage').onclick=e=>{if(e.target.closest('[data-act]'))return;tapDone();};
$('#rCard').onclick=e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(false){}else if(act==='reveal'){R.reveal=true;renderR();}else if(act==='prompt'){prompter();}else if(act==='restart'){R.idx=0;R.paused=false;step();}
  else if(act==='nextscene'){const ss=sections(),k=ss.findIndex(x=>x.start===R.scene.start);if(ss[k+1])startRehearsal(null,ss[k+1]);}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.on&&!R.paused)togglePause();});

/* ---------- manusvy ---------- */
function blockHTML(b){
  if(b.type==='head')return `<div class="blk head ${kindOf(b)}" data-id="${b.id}"><h2>${esc(b.text)}</h2></div>`;
  if(b.type==='dir')return `<div class="blk dir" data-id="${b.id}"><p>${fmt(b.text)}</p></div>`;
  const r=readerOf(b);
  return `<div class="blk line ${r}" data-id="${b.id}" style="--cc:var(--c${charIndex(b.who)})"><div class="who"><span class="nm">${esc(b.who||'?')}</span><span class="tag">${r==='me'?'Du läser':'AI läser'}</span>${b.reader?'<span class="ovr">ändrad</span>':''}<button class="more" type="button" aria-label="Redigera repliken">⋯</button></div><p class="txt">${fmt(b.text,r==='me')}</p></div>`;
}
function renderScript(){$('#script').innerHTML=S.script.blocks.map(blockHTML).join('');}
function renderBar(){const q=S.script.blocks.filter(b=>b.type==='line');const i=q.findIndex(b=>b.id===S.pos);
  $('#playFrom').textContent=i>0?`Fortsätt från replik ${i+1}`:'Repetera';$('#playStart').hidden=!(i>0);}
function renderAll(){$('#title').textContent=S.script.title||'';$('#exBanner').hidden=!S.example;$('#ttsBanner').hidden=hasTTS;renderScript();renderBar();}
$('#script').onclick=e=>{const el=e.target.closest('.blk');if(!el)return;const b=findB(el.dataset.id);if(!b)return;
  if(e.target.closest('.more')||b.type!=='line'){openSheet('edit',b.id);return;}
  const now=readerOf(b)==='ai'?'me':'ai';b.reader=now===defaultReader(b)?null:now;save();
  el.outerHTML=blockHTML(b);toast(now==='me'?`Du läser ${b.who} här.`:`AI läser ${b.who} här.`);};
$('#playFrom').onclick=()=>{const b=S.pos&&findB(S.pos);startRehearsal(b?b.id:null);};
$('#playStart').onclick=()=>startRehearsal(null);
document.querySelectorAll('[data-open]').forEach(btn=>btn.onclick=()=>openSheet(btn.dataset.open));

/* ---------- ark ---------- */
let sheetKind=null,sheetArg=null;
const BUILD={},BIND={};
function openSheet(kind,arg,keep){sheetKind=kind;sheetArg=arg;const p=$('#sheet .panel');const st=p.scrollTop;p.innerHTML=`<div class="sheet-in">${BUILD[kind](arg)}</div>`;$('#sheet').hidden=false;p.scrollTop=keep?st:0;
  const x=p.querySelector('.x');if(x)x.onclick=closeSheet;if(BIND[kind])BIND[kind](arg,p);}
function closeSheet(){if($('#sheet').hidden)return;if(previewStop){previewStop();previewStop=null;}$('#sheet').hidden=true;sheetKind=null;save();renderScript();renderBar();}
$('#sheet .scrim').onclick=closeSheet;

BUILD.import=()=>`<h3>Lägg in manus <button type="button" class="x">Stäng</button></h3>
<p class="note">Filen läses här i telefonen och skickas inte någonstans. Manuset sparas bara i den här telefonen.</p>
<label class="file"><input type="file" id="fPdf" accept="application/pdf,.pdf,.txt,text/plain">Välj PDF eller textfil</label>
<p class="note" id="impProg" aria-live="polite"></p>
<details><summary>Klistra in text i stället</summary>
<label class="f" for="pasteTxt">Manustext</label><textarea id="pasteTxt" rows="8" placeholder="ALF: Hej, är det någon här?"></textarea>
<button type="button" id="pasteGo" class="primary wide">Tolka texten</button></details>
<p class="note">Appen känner igen rollnamn som skrivs före repliken, till exempel <b>ALF:</b> eller <b>ALF</b> på egen rad. Scenanvisningar inom parentes läses inte upp. Blir något fel kan du trycka på raden och rätta den.</p>
<button type="button" id="loadEx" class="ghost">Ladda exempelmanuset</button>`;
BIND.import=(_,p)=>{
  $('#fPdf',p).onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const prog=$('#impProg',p);const title=f.name.replace(/\.(pdf|txt)$/i,'');
    try{if(/\.txt$/i.test(f.name)||f.type==='text/plain'){applyParsed(parseText(await f.text()),title);return;}
      prog.textContent='Öppnar PDF:en…';const {lines,chars}=await pdfToLines(await f.arrayBuffer(),(a,n)=>{prog.textContent=`Läser sida ${a} av ${n}…`;});
      if(chars<40){prog.textContent='PDF:en verkar vara inskannad, alltså bilder utan text. Den går inte att läsa här. Prova en PDF med riktig text, eller klistra in texten.';return;}
      applyParsed(parseLines(lines),title);
    }catch(err){prog.textContent='Kunde inte läsa filen. '+(err&&err.message?err.message:'');}};
  $('#pasteGo',p).onclick=()=>{const t=$('#pasteTxt',p).value;if(!t.trim()){toast('Klistra in text först.');return;}applyParsed(parseText(t),'Inklistrat manus');};
  $('#loadEx',p).onclick=()=>applyParsed(parseText(EXAMPLE),'Exempel: Kaffet',true);
};
function applyParsed(blocks,title,isEx){
  const lines=blocks.filter(b=>b.type==='line');
  if(!lines.length){const msg='Hittade inga rollnamn. Varje replik behöver börja med rollnamnet, till exempel "ALF: Hej" eller ALF på egen rad.';const pr=$('#impProg');if(pr&&!$('#sheet').hidden)pr.textContent=msg;else toast(msg);return false;}
  S.script={title,blocks};S.settings.chars={};S.settings.mine=isEx?['JONAS']:[];S.pos=null;S.example=!!isEx;
  charList().forEach(c=>ensureChar(c.name));save();renderAll();window.scrollTo(0,0);
  if(isEx){closeSheet();toast('Exemplet är laddat. Du läser JONAS.');}
  else{openSheet('roles');toast(`Hittade ${charList().length} roller och ${lines.length} repliker. Bocka för din roll.`);}
  return true;
}

BUILD.scenes=()=>{const ss=sections();let lastAct='__';const rows=ss.map((x,k)=>{let h='';if(x.act!==lastAct&&x.act){h=`<div class="sc-act">${esc(x.act)}</div>`;}lastAct=x.act;
    return h+`<div class="sc-row"><button type="button" class="sc-go" data-k="${k}"><b>${esc(x.title)}</b><span class="cnt">${x.lines} repliker · ${x.mine} dina</span></button><button type="button" class="primary" data-play="${k}">Repetera</button></div>`;}).join('');
  return `<h3>Scener <button type="button" class="x">Stäng</button></h3>
<p class="note">Scenerna hittas automatiskt, till exempel AKT 2, Scen 3, 1:2, 2:1, 1A, 1b och "4. Titel". Saknas en scen: tryck på raden där den börjar, välj ⋯ och "Ny scen börjar här".</p>
${ss.length>1?'':'<p class="warn">Hittade inga scenrubriker i det här manuset.</p>'}
${rows}
<button type="button" class="ghost" id="scAll">Repetera hela manuset</button>`;};
BIND.scenes=(_,p)=>{const ss=sections();
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const x=ss[+b.dataset.k];closeSheet();const bl=S.script.blocks[x.start];const el=bl&&document.querySelector(`[data-id="${bl.id}"]`);const hd=x.id&&document.querySelector(`[data-id="${x.id}"]`);(hd||el)&&(hd||el).scrollIntoView({block:'start'});});
  p.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>startRehearsal(null,ss[+b.dataset.play]));
  $('#scAll',p).onclick=()=>startRehearsal(null);};
BUILD.roles=()=>{const cs=charList();const sv=svVoices();
  return `<h3>Roller och röster <button type="button" class="x">Klar</button></h3>
<p class="note">Bocka för din roll. AI:n läser alla andra. Du kan också trycka på enskilda repliker i manuset för att byta.</p>
${hasTTS&&!sv.length?'<p class="warn">Hittar ingen svensk röst i telefonen just nu. Rösterna kan ta en stund att dyka upp första gången.</p>':''}
${cs.map((c,i)=>{const cfg=ensureChar(c.name),mine=S.settings.mine.includes(c.name);

    <div><div class="kv"><span>Tempo</span><span class="rv">${cfg.rate.toFixed(2)}</span></div><input type="range" id="r-${i}" class="rSl" min=".6" max="1.4" step=".02" value="${cfg.rate}" aria-label="Tempo"></div>

BIND.roles=(_,p)=>{p.querySelectorAll('.role').forEach(row=>{const name=row.dataset.name,c=ensureChar(name);
  row.querySelector('.mineChk').onchange=e=>{const m=new Set(S.settings.mine);e.target.checked?m.add(name):m.delete(name);S.settings.mine=[...m];save();row.querySelector('.role-b').hidden=e.target.checked;};
  row.querySelector('.vSel').onchange=e=>{c.voiceURI=e.target.value;save();};
  row.querySelector('.pSl').oninput=e=>{c.pitch=+e.target.value;row.querySelector('.pv').textContent=c.pitch.toFixed(2);save();};
  row.querySelector('.rSl').oninput=e=>{c.rate=+e.target.value;row.querySelector('.rv').textContent=c.rate.toFixed(2);save();};
  row.querySelector('.test').onclick=()=>{const first=S.script.blocks.find(b=>b.type==='line'&&b.who===name);preview(first||{text:'Hej, det här är min röst.',tone:'auto'},charCfg(name));};
  row.querySelector('.merge').onchange=e=>{const to=e.target.value;if(!to)return;S.script.blocks.forEach(b=>{if(b.who===name)b.who=to;});delete S.settings.chars[name];S.settings.mine=S.settings.mine.filter(n=>n!==name);save();openSheet('roles',null,true);toast(`${name} är ihopslagen med ${to}.`);};
});};

BUILD.edit=id=>{const b=findB(id);if(!b)return '<p class="note">Raden finns inte längre.</p><button type="button" class="x">Stäng</button>';
  const names=charList().map(c=>c.name);
  return `<h3>Redigera rad <button type="button" class="x">Klar</button></h3>
<div class="seg" role="group" aria-label="Typ av rad">${[['line','Replik'],['dir','Anvisning'],['head','Rubrik']].map(([t,l])=>`<button type="button" data-type="${t}" class="${b.type===t?'on':''}">${l}</button>`).join('')}</div>
${b.type==='line'?`<label class="f" for="eWho">Roll</label><input type="text" id="eWho" list="whoList" value="${esc(b.who||'')}" autocapitalize="characters" autocomplete="off"><datalist id="whoList">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<label class="f" for="eReader">Läses av</label><select id="eReader"><option value=""${!b.reader?' selected':''}>Automatiskt (${defaultReader(b)==='me'?'du':'AI'})</option><option value="ai"${b.reader==='ai'?' selected':''}>AI</option><option value="me"${b.reader==='me'?' selected':''}>Jag själv</option></select>`:''}
${b.type==='head'?`<label class="f" for="eKind">Typ av rubrik</label><select id="eKind"><option value="scene"${kindOf(b)==='scene'?' selected':''}>Scen</option><option value="act"${kindOf(b)==='act'?' selected':''}>Akt</option></select>`:''}
<label class="f" for="eText">Text</label><textarea id="eText" rows="${b.type==='head'?2:6}">${esc(b.text)}</textarea>
<div class="row"><button type="button" class="ghost" id="ePs">+ Kort paus</button><button type="button" class="ghost" id="ePl">+ Lång paus</button></div>
<p class="note">Pausen hamnar där markören står och visas som / (kort) eller // (lång). AI:n stannar där. </p>

${b.type==='head'?`<button type="button" class="primary" id="eScene">Repetera den här scenen</button>`:`<div class="row"><button type="button" class="ghost" id="eTest">Provlyssna</button><button type="button" class="primary" id="eStart">Repetera härifrån</button></div>
<button type="button" class="ghost" id="eNewScene">Ny scen börjar här</button>`}
<div class="row"><button type="button" class="ghost" id="eMerge">Slå ihop med raden ovanför</button><button type="button" class="danger" id="eDel">Ta bort raden</button></div>`;};
BIND.edit=(id,p)=>{const b=findB(id);if(!b)return;
  p.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=()=>{b.type=btn.dataset.type;if(b.type==='head')b.kind=headKind(b.text)||'scene';if(b.type==='line'&&!b.who){b.who=prevWho(b)||(charList()[0]||{}).name||'ROLL';b.reader=null;b.tone='auto';}save();openSheet('edit',id,true);});
  const who=$('#eWho',p);if(who)who.onchange=()=>{const n=cleanName(who.value);if(n){b.who=n;ensureChar(n);save();openSheet('edit',id,true);}};
  const rd=$('#eReader',p);if(rd)rd.onchange=e=>{b.reader=e.target.value||null;save();};
  const tn=$('#eTone',p);if(tn)tn.onchange=e=>{b.tone=e.target.value;save();};
  const ta=$('#eText',p);ta.oninput=()=>{b.text=ta.value;save();};
  const ins=m=>{const v=ta.value,s=ta.selectionStart??v.length,e=ta.selectionEnd??s;const before=v.slice(0,s).replace(/\s+$/,''),after=v.slice(e).replace(/^\s+/,'');
    ta.value=(before+' '+m+' '+after).trim();const pos=Math.min(ta.value.length,(before+' '+m+' ').length);b.text=ta.value;save();ta.focus();try{ta.setSelectionRange(pos,pos);}catch(x){}};
  $('#ePs',p).onclick=()=>ins('/');$('#ePl',p).onclick=()=>ins('//');
  const rt=$('#eResetT',p);if(rt)rt.onclick=()=>{delete b.myTime;save();openSheet('edit',id,true);};
  const ek=$('#eKind',p);if(ek)ek.onchange=e=>{b.kind=e.target.value;save();};
  const es=$('#eScene',p);if(es)es.onclick=()=>{save();renderScript();const x=sectionOf(b.id)||sections().find(z=>z.id===b.id);if(x)startRehearsal(null,x);else toast('Scenen har inga repliker.');};
  const en=$('#eNewScene',p);if(en)en.onclick=()=>{const bl=S.script.blocks,i=bl.indexOf(b);const h={id:uid(),type:'head',kind:'scene',text:'Ny scen'};bl.splice(i,0,h);save();renderScript();openSheet('edit',h.id);toast('Skriv in scenens namn.');};
  const et=$('#eTest',p);if(et)et.onclick=()=>preview(b,b.type==='line'?charCfg(b.who):{...S.settings.narrator,idx:0});
  const est=$('#eStart',p);if(est)est.onclick=()=>{b.text=normalizePauses(ta.value);save();renderScript();startRehearsal(b.id);};
  $('#eMerge',p).onclick=()=>{const bl=S.script.blocks,i=bl.indexOf(b);if(i<1){toast('Det finns ingen rad ovanför.');return;}const a=bl[i-1];a.text=joinText(a.text||'',b.text);bl.splice(i,1);save();openSheet('edit',a.id);};
  $('#eDel',p).onclick=ev=>{const btn=ev.currentTarget;if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Tryck igen för att ta bort';return;}S.script.blocks.splice(S.script.blocks.indexOf(b),1);closeSheet();toast('Raden är borttagen.');};
};

function paceLabel(v){return v<.85?'snabb':v<1.15?'normal':v<1.45?'lugn':'mycket lugn';}
function micText(){if(!S.settings.useMic)return 'Avstängd. Du trycker på skärmen efter dina repliker.';return VAD.state==='denied'?'Mikrofonen gick inte att starta ('+VAD.err+').':'Mikrofonen startas när det är din tur.';}
BUILD.settings=()=>{const st=S.settings;return `<h3>Inställningar <button type="button" class="x">Klar</button></h3>
<div><div class="kv"><span>Kort paus</span><span id="spv">${st.shortPause.toFixed(1)} s</span></div><input type="range" id="sPs" min=".2" max="2" step=".1" value="${st.shortPause}" aria-label="Kort paus i sekunder"></div>
<div><div class="kv"><span>Lång paus</span><span id="lpv">${st.longPause.toFixed(1)} s</span></div><input type="range" id="sPl" min=".8" max="5" step=".1" value="${st.longPause}" aria-label="Lång paus i sekunder"></div>
<div><div class="kv"><span>Tempo för alla AI-röster</span><span id="tpv">${st.tempo.toFixed(2)}</span></div><input type="range" id="sTp" min=".7" max="1.3" step=".02" value="${st.tempo}" aria-label="Tempo för alla röster"></div>
<label class="chk"><input type="checkbox" id="sMic"${st.useMic?' checked':''}>Lyssna med mikrofonen på mina repliker</label>
<div><div class="kv"><span>Mikrofonens känslighet</span><span id="msv">${(st.micSens||1).toFixed(1)}</span></div><input type="range" id="sSens" min=".5" max="2.5" step=".1" value="${st.micSens||1}" aria-label="Mikrofonens känslighet"></div>
<label class="chk"><input type="checkbox" id="sPiper"${st.piper!==false?' checked':''}>Använd AI-röster (Piper) för motspelarna</label>
<p class="note">Tre svenska AI-röster som körs i telefonen: NST, Lisa och Alma. Varje röst är ungefär 60 MB och laddas ner första gången den används. Använd gärna bara en eller två röster, det sparar minne. Välj röst per roll under Roller. Gratis och fungerar utan internet efter nedladdningen.</p>
<button type="button" class="ghost" id="sPiperLoad">Ladda ner rösterna som används nu</button>
<div><div class="kv"><span>Min taltakt</span><span id="pcv">${paceLabel(st.pace||1)}</span></div><input type="range" id="sPace" min=".7" max="1.8" step=".05" value="${st.pace||1}" aria-label="Hur mycket tid appen ger dig per replik"></div>
<div><div class="kv"><span>Tystnad efter din replik innan appen går vidare</span><span id="qsv">${(st.quietSec||.8).toFixed(1)} s</span></div><input type="range" id="sQuiet" min=".4" max="4" step=".1" value="${st.quietSec||.8}" aria-label="Sekunder tystnad innan appen går vidare"></div>
<p class="note">Appen väntar hur länge som helst tills du börjar prata. Den räknar ut hur länge repliken tar att säga i snabb takt och går vidare först när du har pratat nästan så länge och sedan är tyst så här länge. Dra Min taltakt åt höger om du behöver mer tid. Går den vidare för tidigt på en viss replik: tryck Backa direkt, så väntar den längre på just den repliken i fortsättningen. Hör den dig inte, höj känsligheten. Hoppar den för tidigt, sänk den eller öka tystnaden.</p>
<p class="note">${esc(micText())}</p>
<p class="note">Utan mikrofon väntar appen hur länge som helst på din replik. Tryck var som helst på skärmen när du är klar.</p>
<p class="note">Med mikrofonen går appen bara vidare när den hört slutorden i din replik eller när du säger "nästa". Tystnad får den aldrig att gå vidare. Glömmer du bort dig kan du säga "sufflera".</p>
<label class="chk"><input type="checkbox" id="sHide"${st.hideMine?' checked':''}>Dölj mina repliker under repetition (visa bara första bokstäverna)</label>
<label class="chk"><input type="checkbox" id="sDirs"${st.readDirs?' checked':''}>Läs upp scenanvisningar</label>
<div id="narr"${st.readDirs?'':' hidden'}><label class="f" for="sNv">Röst för scenanvisningar</label><select id="sNv">${voiceOptions(st.narrator.voiceURI)}</select></div>
<button type="button" class="danger" id="sClear">Rensa manus och inställningar</button>
<p class="note">Motläsaren version 23 (Safari)</p>`;};
BIND.settings=(_,p)=>{const st=S.settings;
  $('#sPs',p).oninput=e=>{st.shortPause=+e.target.value;$('#spv',p).textContent=st.shortPause.toFixed(1)+' s';save();};
  $('#sPl',p).oninput=e=>{st.longPause=+e.target.value;$('#lpv',p).textContent=st.longPause.toFixed(1)+' s';save();};
  $('#sTp',p).oninput=e=>{st.tempo=+e.target.value;$('#tpv',p).textContent=st.tempo.toFixed(2);save();};
  $('#sPiper',p).onchange=e=>{st.piper=e.target.checked;save();};
  $('#sPiperLoad',p).onclick=()=>{const ids=[...new Set(charList().filter(c=>!S.settings.mine.includes(c.name)).map(c=>piperVoiceOf(charCfg(c.name))).filter(Boolean))];ids.reduce((pr,id)=>pr.then(()=>piperEnsure(id)).catch(e=>toast('Rösten '+PIPER_VOICES[id]+' kunde inte laddas: '+(e&&e.message||e))),Promise.resolve()).then(()=>toast('Rösterna är klara.'));toast('Laddar ner '+ids.map(i=>PIPER_VOICES[i]).join(' och ')+'. Det tar en stund första gången.');};
  $('#sPace',p).oninput=e=>{st.pace=+e.target.value;$('#pcv',p).textContent=paceLabel(st.pace);save();};
  $('#sQuiet',p).oninput=e=>{st.quietSec=+e.target.value;$('#qsv',p).textContent=st.quietSec.toFixed(1)+' s';save();};
  $('#sSens',p).oninput=e=>{st.micSens=+e.target.value;$('#msv',p).textContent=st.micSens.toFixed(1);save();};
  $('#sMic',p).onchange=e=>{st.useMic=e.target.checked;if(st.useMic&&micState==='denied')micState=SR?'unknown':'missing';save();openSheet('settings',null,true);};
  $('#sHide',p).onchange=e=>{st.hideMine=e.target.checked;save();};
  $('#sDirs',p).onchange=e=>{st.readDirs=e.target.checked;$('#narr',p).hidden=!st.readDirs;save();};
  $('#sNv',p).onchange=e=>{st.narrator.voiceURI=e.target.value;save();};
  $('#sClear',p).onclick=ev=>{const btn=ev.currentTarget;if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Tryck igen för att rensa allt';return;}
    try{localStorage.removeItem(STORE);}catch(e){}S={script:null,settings:defaults(),pos:null,example:false};applyParsed(parseText(EXAMPLE),'Exempel: Kaffet',true);};
};

/* ---------- toast & start ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},Math.max(2800,msg.length*70));}
if(hasTTS){refreshVoices();try{speechSynthesis.onvoiceschanged=()=>{refreshVoices();if(sheetKind==='roles'||sheetKind==='settings')openSheet(sheetKind,sheetArg,true);};}catch(e){}}
if(!load()){S.script={title:'',blocks:parseText(EXAMPLE)};S.settings.mine=['JONAS'];S.example=true;S.script.title='Exempel: Kaffet';charList().forEach(c=>ensureChar(c.name));}
renderAll();
})();
</script>
